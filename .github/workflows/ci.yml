name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [modes, adsb-core]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      # Each project's rust-toolchain.toml pins `stable`, so components and the
      # target are installed on that same toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ matrix.project }} -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --target riscv32imc-unknown-none-elf

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    env:
      # Bump together with the local `esp` toolchain; part of the cache key.
      ESP_TOOLCHAIN_VERSION: 1.97.0.0
      # Dummy build configuration (RFC 5737 TEST-NET host, point in the ocean).
      # Not secrets: CI never connects to anything, and this build is never flashed.
      WIFI_SSID: ci-dummy-ssid
      WIFI_KEY: ci-dummy-password
      ADSB_FEED_HOST: 192.0.2.1
      ADSB_RX_LAT: "0.0"
      ADSB_RX_LON: "0.0"
      ADSB_RADIUS_KM: "5"
    steps:
      - uses: actions/checkout@v7
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
          version: ${{ env.ESP_TOOLCHAIN_VERSION }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: firmware -> target
          key: esp-${{ env.ESP_TOOLCHAIN_VERSION }}
      - name: build_config host tests
        run: rustc --test --edition 2024 build_config.rs -o "$RUNNER_TEMP/bc_test" && "$RUNNER_TEMP/bc_test"
      - run: cargo build --release
      - run: cargo clippy -- -D warnings
