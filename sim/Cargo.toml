[package]
name = "sim"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
adsb-app = { path = "../adsb-app" }
adsb-core = { path = "../adsb-core", features = ["scenario"] }

[dev-dependencies]
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
  "HtmlSelectElement", "CanvasRenderingContext2d", "ImageData", "MouseEvent", "Performance",
  "DomRect", "CssStyleDeclaration", "EventTarget", "Event", "console", "WebSocket", "MessageEvent", "BinaryType",
  "Response", "Location",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Slint 1.18.1 scene.rs off-by-one, see vendor/i-slint-renderer-software/VENDORED.md. Drop once fixed upstream.
[patch.crates-io]
i-slint-renderer-software = { path = "../vendor/i-slint-renderer-software" }
