[package]
name = "adsb-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
heapless = "0.9"
libm = "0.2"
modes = { path = "../modes" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
zune-jpeg = { version = "=0.5.15", default-features = false, optional = true }

[features]
# JPEG decode and scale for the photo (RD.7). Off for builds that never decode (modes, plain tests).
photo = ["dep:zune-jpeg"]
# Deterministic seeded scenarios (fictitious receiver) emitting AVR lines; pulls in `modes/encode`.
scenario = ["modes/encode"]

[dev-dependencies]
jpeg-encoder = { version = "0.7", default-features = false }
modes = { path = "../modes", features = ["encode"] }
