# Flash settings written into the image header by espflash (also used by the bench host,
# which runs espflash from the repo root). 80 MHz QIO in place of the 40 MHz DIO default:
# faster flash cache refills leave more MSPI bus time for the PSRAM framebuffer DMA
# (radar-ui RD.2, risk K4). Check: `od -An -tx1 -N4 <image>` gives `e9 05 00 2f`.
[flash]
mode = "qio"
frequency = "80MHz"
