[package]
name = "sim-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Loopback-only bridge for the browser simulator: ws<->tcp feed relay and local config/capture (dev only)"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync"] }

[dev-dependencies]
adsb-core = { path = "../adsb-core", features = ["scenario"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
